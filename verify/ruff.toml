# Lint of the Python end-to-end tests (tests/e2e). Run by verify/run.sh.
target-version = "py310"
line-length = 200

# flow.py runs multi.py and vitest.py inside its own namespace (exec), so they use names that
# flow.py defines. Exactly those names are listed here; any other undefined name is still an error.
builtins = [
    "check", "sdlc", "PROJ", "git", "write", "bash", "agent_write", "admin", "TEMPLATE", "state",
    "hook", "WORK", "SELFTEST_OUT", "json", "commit", "PORT",
]

[lint]
# pyflakes (F), the pycodestyle errors (E4, E7, E9) and bugbear (B): real mistakes, not style.
select = ["E4", "E7", "E9", "F", "B"]
