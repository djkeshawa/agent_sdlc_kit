# package: the tool as self-contained bundles (Linux x64, macOS arm64) and as a container image,
#   each smoke-tested against a repository with no .agent/ folder and no JDK on the PATH.
#   The bundles are kept as workflow artifacts. Nothing is published and no registry is used.
name: package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: sdlc-linux-x64
            image: true
          - os: macos-latest
            bundle: sdlc-macos-arm64
            image: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the bundle
        run: sh packaging/build.sh
      - name: Build the image
        if: matrix.image
        run: docker build -f packaging/Dockerfile --build-arg SDLC_VERSION="$(cat dist/${{ matrix.bundle }}/VERSION)" -t sdlc:smoke .
      - name: Smoke test
        env:
          SMOKE_REQUIRE_TLS: '1'
          SKIP_DOCKER: ${{ matrix.image && '0' || '1' }}
          SMOKE_BUILD: '0'
          IMAGE: sdlc:smoke
        run: sh packaging/smoke.sh dist/${{ matrix.bundle }}
      - name: Image size
        if: matrix.image
        run: docker image ls sdlc:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle }}
          path: dist/${{ matrix.bundle }}.tar.gz
          if-no-files-found: error
          retention-days: 14
