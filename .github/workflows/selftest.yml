# selftest: the kit's built-in guardrail tests on every platform a team may use. The template is
#   copied into a scratch git repository first, the way a team installs it.
# flow: one story from ticket to merge against mock Jira, Confluence, Jenkins and SonarQube
#   (tests/e2e). It drives the kit through sh, so it runs on Linux and macOS only.
name: selftest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Install the template into a scratch repository
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/repo"
          cp -R template/. "$RUNNER_TEMP/repo/"
          git -C "$RUNNER_TEMP/repo" init -q -b develop
      - name: Self test
        shell: bash
        run: cd "$RUNNER_TEMP/repo" && java .agent/Sdlc.java selftest

  flow:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: End-to-end flow against mock services
        run: python3 tests/e2e/run.py
