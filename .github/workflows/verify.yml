name: verify

# The verification layers that the self tests and the end-to-end flow do not cover
# (docs/11-verification.md): static analysis, coverage, and sdlc check against real Maven and Vitest.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: The pinned ruff
        run: pip install "ruff==$(awk '$1 == "ruff" { print $2 }' verify/tools.lock)"
      - name: Strict compile, lint, SpotBugs
        run: sh verify/run.sh compile lint bugs
      - name: What the tools said
        if: failure()
        run: tail -n 100 "${XDG_CACHE_HOME:-$HOME/.cache}"/sdlc-verify/work/*/logs/*.log

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Self tests, their count and coverage against the floors
        run: sh verify/run.sh selftest
      - name: Coverage per package
        if: always()
        run: grep -A 12 'Analyzing' "${XDG_CACHE_HOME:-$HOME/.cache}"/sdlc-verify/work/*/logs/selftest.log || true

  real-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Maven's repository, kept between runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: verify-m2-${{ hashFiles('tests/e2e/maven.py') }}
          restore-keys: verify-m2-
      - name: sdlc check against real Maven and real Vitest
        run: sh verify/run.sh real
      - name: What the real tools said
        if: failure()
        run: tail -n 200 "${XDG_CACHE_HOME:-$HOME/.cache}"/sdlc-verify/work/*/logs/real.log
