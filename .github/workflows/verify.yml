name: verify

# The verification layers that the self tests and the end-to-end flow do not cover
# (docs/11-verification.md): static analysis, coverage, and sdlc check against real Maven and Vitest.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: The pinned ruff
        run: pip install "ruff==$(awk '$1 == "ruff" { print $2 }' verify/tools.lock)"
      - name: Strict compile, lint, SpotBugs
        run: sh verify/run.sh compile lint bugs

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Self tests with coverage floors
        run: sh verify/run.sh selftest
      - name: Coverage per package
        if: always()
        run: grep -A 12 'Analyzing' "${XDG_CACHE_HOME:-$HOME/.cache}/sdlc-verify/work/logs/selftest.log" || true

  real-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: sdlc check against real Maven and real Vitest
        run: sh verify/run.sh real
      - name: What the real tools said
        if: failure()
        run: tail -n 200 "${XDG_CACHE_HOME:-$HOME/.cache}/sdlc-verify/work/logs/real.log"
