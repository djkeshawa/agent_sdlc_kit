# =====================================================================================
# Agent SDLC configuration - the one file you edit.
#
# After editing, run:   java .agent/Sdlc.java config check
# After changing agents.*.model or the MCP parts, also:   java .agent/Sdlc.java config apply
#
# Anything not set here falls back to built-in defaults for the chosen stack (see
# docs/03-configuration.md for the full list). To ADD to a default list instead of replacing
# it, end the key with "+", e.g.   protected+: [docs/legal/**]
#
# Agents cannot edit this file (the hooks refuse); CODEOWNERS makes a tech lead review changes.
# =====================================================================================

# java-maven | java-gradle | node   (node = JavaScript / TypeScript with npm, yarn or pnpm)
stack: java-maven

project:
  name: payments-service          # used in page titles
  team: payments                  # {team} in the LLD title; tells the agents whose LLD is "ours"

# ---------------------------------------------------------------------------------------
# Jira
# ---------------------------------------------------------------------------------------
jira:
  deployment: cloud               # cloud (*.atlassian.net) | datacenter
  url: https://yourcompany.atlassian.net
  projectKeys: [PAY]              # keys this repo works with (branches, commits, PR titles)
  issueTypes:
    task: Sub-task                # type created for each task of the LLD work breakdown
  epicLinkField: ""               # Data Center only: e.g. customfield_10014, to find a story's epic
  statuses:                       # exact status names of your workflow
    inProgress: In Progress
    inReview: In Review
    done: Done
  agentMayClose: false            # true = the tool moves tickets to Done when the PR is merged

# ---------------------------------------------------------------------------------------
# Confluence - where the one pagers, HLDs, test designs and LLDs live.
# Pages are found by the Jira key in their title (e.g. "PAY-100 Refunds - One Pager").
# ---------------------------------------------------------------------------------------
confluence:
  url: https://yourcompany.atlassian.net/wiki   # Data Center: https://confluence.yourcompany.com
  searchSpaces: [PROD, ARCH, QE, PAYDEV, ORDERSDEV]   # product, architecture, QE and every team's dev space
  titlePatterns:                  # how the page type is recognised from its title (regex)
    onePager: "(?i)one[ -]?pager"
    hld: "(?i)\\bhld\\b|high[ -]?level design"
    lld: "(?i)\\blld\\b|low[ -]?level design"
    testDesign: "(?i)test (scenarios|design|cases)"
  publish:
    testDesign:                   # where /test-design publishes the mind map and test scenarios
      space: QE
      parentId: ""                # page id of the parent page (see docs/02-setup.md)
      title: "{key} - Test scenarios"
    lld:                          # where /design publishes this team's LLD
      space: PAYDEV
      parentId: ""
      title: "{key} - LLD - {team}"
  mermaidMacro: ""                # name of your Confluence Mermaid macro, if you have the app (else diagrams stay code blocks)
  mindmapImage: true              # render the mind map as a PNG on the page

# ---------------------------------------------------------------------------------------
# GitHub - other teams' repositories the designer may read (GitHub MCP or local copies)
# ---------------------------------------------------------------------------------------
github:
  host: github.com                # or your GitHub Enterprise host, e.g. github.yourcompany.com
  org: ""                         # your GitHub organisation: limits commit searches (eval collect, catalog cochange)
  relatedRepos: []
  # relatedRepos:
  #   - name: orders-service
  #     repo: yourorg/orders-service
  #     team: orders
  #     purpose: owns orders; refunds call its REST API

# ---------------------------------------------------------------------------------------
# CI - your EXISTING Jenkins and SonarQube are only read, never changed
# ---------------------------------------------------------------------------------------
ci:
  waitMinutes: 60                 # how long `ci wait` waits for the PR checks
  pollSeconds: 30
  jenkins:
    url: https://jenkins.yourcompany.com
  sonar:
    url: https://sonar.yourcompany.com
    projectKey: com.yourcompany:payments-service

# ---------------------------------------------------------------------------------------
# Human gates and loops
# ---------------------------------------------------------------------------------------
gates:
  testDesign: required            # required | optional | off - QE lead approves the test design
  lld: required                   # required | optional | off - tech lead approves the LLD before tickets and code
  approvers:                      # Cloud: account ids, Data Center: usernames. Empty = any human.
    testDesign: []
    lld: []
  botAccounts: []                 # accounts whose comments never count as approval
  allowSelfApproval: false        # true = the person who published a page may approve it (a team of one)

loops:
  review: {min: 2, max: 5}        # implementer <-> blind reviewer rounds per task
  qa: {max: 3}                    # failed QA rounds before handing back to a human
  ci: {max: 3}                    # failed CI rounds (Jenkins / Sonar) before handing back

delivery:
  baseBranch: develop
  createSubtasks: true            # false = tasks tracked locally only (small stories)
  qa: auto                        # auto (when the test design has integration/e2e scenarios) | always | never

# ---------------------------------------------------------------------------------------
# Coding agents used in this repository. copilot = .github (always there); claude and codex:
# `config apply` generates their hooks, agents, commands/skills from .github (docs/02 step 8).
# ---------------------------------------------------------------------------------------
tools: [copilot]                  # e.g. [copilot, claude, codex]

# ---------------------------------------------------------------------------------------
# Agent models per step. Use the names your Copilot model picker shows, e.g.
# "Claude Sonnet 4.5 (copilot)". Empty = whatever the picker has selected.
# Tip: give the reviewer a different model family than the implementer.
# Run `java .agent/Sdlc.java config apply` after changing these.
# ---------------------------------------------------------------------------------------
agents:
  orchestrator: {model: ""}
  analyst: {model: ""}
  qe-designer: {model: ""}
  designer: {model: ""}
  implementer: {model: ""}
  reviewer: {model: ""}
  qa-verifier: {model: ""}
  ci-fixer: {model: ""}
  impact-analyst: {model: ""}     # scoping (multi-component); a different family than the architect helps
  eval-runner: {model: ""}

